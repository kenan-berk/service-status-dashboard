services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compose-starter-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 3000
      DATA_FILE: /app/data/items.json
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  app_data: